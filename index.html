<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语四级核心词 - 点击朗读</title>

<style>
:root {
  --bg-deep: #0d1117;
  --bg-card: #161b22;
  --bg-elevated: #1c2128;
  --border-subtle: #30363d;
  --border-glow: #58a6ff;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent-gold: #d4a853;
  --accent-warm: #e07a5f;
  --accent-cool: #58a6ff;
  --accent-mint: #3fb950;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Serif SC', Georgia, serif;
  background: var(--bg-deep);
  min-height: 100vh;
  color: var(--text-primary);
  overflow-x: hidden;
}

/* Ambient background glow */
body::before {
  content: '';
  position: fixed;
  top: -20%;
  left: -10%;
  width: 50%;
  height: 60%;
  background: radial-gradient(ellipse, rgba(88,166,255,0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -20%;
  right: -10%;
  width: 50%;
  height: 60%;
  background: radial-gradient(ellipse, rgba(212,168,83,0.05) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 40px 24px;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 48px;
  position: relative;
}
.header-decoration {
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-gold), var(--accent-warm));
  margin: 0 auto 24px;
  border-radius: 2px;
}
.header h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 3em;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 12px;
}
.header .subtitle {
  font-size: 1.1em;
  color: var(--text-secondary);
  font-weight: 400;
  letter-spacing: 0.05em;
}
.header .subtitle span {
  color: var(--accent-gold);
  font-weight: 600;
}

/* Controls Bar */
.controls-bar {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 20px 28px;
  margin-bottom: 32px;
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 24px rgba(0,0,0,0.2);
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 260px;
}
.search-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--text-muted);
  pointer-events: none;
}
.search-box {
  width: 100%;
  padding: 12px 16px 12px 44px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  font-size: 15px;
  color: var(--text-primary);
  font-family: 'Noto Serif SC', serif;
  transition: all 0.3s ease;
}
.search-box::placeholder { color: var(--text-muted); }
.search-box:focus {
  outline: none;
  border-color: var(--border-glow);
  box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
}

.unit-filter {
  padding: 12px 18px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  font-size: 15px;
  color: var(--text-primary);
  font-family: 'Noto Serif SC', serif;
  cursor: pointer;
  transition: all 0.3s ease;
  min-width: 140px;
}
.unit-filter:focus {
  outline: none;
  border-color: var(--border-glow);
}

.rate-control {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
  color: var(--text-secondary);
}
.rate-control label { font-weight: 600; }
.rate-control input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 120px;
  height: 4px;
  background: var(--border-subtle);
  border-radius: 2px;
  cursor: pointer;
}
.rate-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent-gold);
  cursor: pointer;
  box-shadow: 0 0 8px rgba(212,168,83,0.4);
}
.rate-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--accent-gold);
  min-width: 36px;
  text-align: right;
}

.stats-line {
  text-align: center;
  margin-bottom: 28px;
  color: var(--text-muted);
  font-size: 14px;
  letter-spacing: 0.03em;
}
.stats-line .highlight {
  color: var(--accent-gold);
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}

/* Grid */
.word-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

/* Card */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 24px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
.card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--unit-color, var(--accent-gold));
  opacity: 0.7;
  transition: opacity 0.3s;
}
.card:hover {
  transform: translateY(-3px);
  border-color: rgba(88,166,255,0.3);
  box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(88,166,255,0.1);
}
.card:hover::before { opacity: 1; }

.card-inner {
  position: relative;
  z-index: 1;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}

.word {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.6em;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.01em;
  line-height: 1.2;
}

.speaker-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: all 0.3s ease;
  flex-shrink: 0;
  margin-left: 12px;
}
.speaker-btn svg {
  width: 18px;
  height: 18px;
}
.card:hover .speaker-btn {
  color: var(--accent-gold);
  border-color: rgba(212,168,83,0.3);
}

.phonetic {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.9em;
  color: var(--text-secondary);
  margin-bottom: 12px;
  letter-spacing: 0.02em;
}

.definition {
  font-size: 0.95em;
  color: var(--text-secondary);
  line-height: 1.7;
}

.unit-tag {
  display: inline-block;
  margin-top: 14px;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.75em;
  font-weight: 600;
  letter-spacing: 0.03em;
  background: rgba(255,255,255,0.05);
  color: var(--unit-color, var(--text-muted));
  border: 1px solid rgba(255,255,255,0.06);
  font-family: 'JetBrains Mono', monospace;
}

/* Speaking state */
.card.speaking {
  border-color: var(--accent-gold);
  box-shadow: 0 0 0 1px rgba(212,168,83,0.2), 0 8px 32px rgba(212,168,83,0.1);
  animation: cardPulse 1.5s ease-in-out infinite;
}
.card.speaking::before {
  background: var(--accent-gold);
  opacity: 1;
}
.card.speaking .speaker-btn {
  background: rgba(212,168,83,0.15);
  color: var(--accent-gold);
  border-color: rgba(212,168,83,0.3);
}
.card.speaking .word {
  color: var(--accent-gold);
}

@keyframes cardPulse {
  0%, 100% { box-shadow: 0 0 0 1px rgba(212,168,83,0.2), 0 8px 32px rgba(212,168,83,0.1); }
  50% { box-shadow: 0 0 0 1px rgba(212,168,83,0.35), 0 8px 40px rgba(212,168,83,0.18); }
}

.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}
.no-results-icon {
  font-size: 3em;
  margin-bottom: 16px;
  opacity: 0.5;
}

/* Responsive */
@media (max-width: 640px) {
  .container { padding: 24px 16px; }
  .header h1 { font-size: 2.2em; }
  .controls-bar { flex-direction: column; align-items: stretch; }
  .search-wrap { min-width: auto; }
  .word-grid { grid-template-columns: 1fr; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>

function getUnitColor(unit) {
  return UNIT_COLORS[unit] || '#d4a853';
}

function speak(word, card) {
  if (!window.speechSynthesis) {
    alert('您的浏览器不支持语音朗读功能');
    return;
  }
  window.speechSynthesis.cancel();
  if (currentSpeaking) {
    currentSpeaking.classList.remove('speaking');
  }
  var utterance = new SpeechSynthesisUtterance(word);
  // Use Chinese voice for "Chinese pronunciation" of English words
  utterance.lang = 'zh-CN';
  utterance.rate = parseFloat(rateSlider.value);
  utterance.pitch = 1;
  utterance.onend = function() {
    if (card) card.classList.remove('speaking');
    currentSpeaking = null;
  };
  utterance.onerror = function() {
    if (card) card.classList.remove('speaking');
    currentSpeaking = null;
  };
  if (card) {
    card.classList.add('speaking');
    currentSpeaking = card;
  }
  window.speechSynthesis.speak(utterance);
}

function render() {
  var query = searchBox.value.toLowerCase().trim();
  var unit = unitFilter.value;
  var filtered = WORDS.filter(function(w) {
    var matchQuery = !query ||
      w.word.toLowerCase().indexOf(query) !== -1 ||
      w.definition.toLowerCase().indexOf(query) !== -1;
    var matchUnit = !unit || w.unit === unit;
    return matchQuery && matchUnit;
  });

  stats.innerHTML = '共 <span class="highlight">' + filtered.length + '</span> 个单词' +
    (filtered.length < WORDS.length ? ' <span style="opacity:0.6">/ 总计 ' + WORDS.length + '</span>' : '');

  wordGrid.innerHTML = '';
  if (filtered.length === 0) {
    wordGrid.innerHTML = '<div class="no-results"><div class="no-results-icon">&#128218;</div><div>没有找到匹配的单词</div></div>';
    return;
  }

  filtered.forEach(function(w) {
    var color = getUnitColor(w.unit);
    var card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--unit-color', color);
    card.innerHTML =
      '<div class="card-inner">' +
        '<div class="card-top">' +
          '<div class="word">' + escapeHtml(w.word) + '</div>' +
          '<div class="speaker-btn">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>' +
          '</div>' +
        '</div>' +
        '<div class="phonetic">' + escapeHtml(w.phonetic) + '</div>' +
        '<div class="definition">' + escapeHtml(w.definition) + '</div>' +
        '<span class="unit-tag">' + w.unit + '</span>' +
      '</div>';
    card.addEventListener('click', function() {
      speak(w.word, card);
    });
    wordGrid.appendChild(card);
  });
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

searchBox.addEventListener('input', render);
unitFilter.addEventListener('change', render);
render();
</script>
</body>
</html>
